{% extends 'base.html' %}
{% block content %}
  <h2>Upload Explanation for {{ trade.name }}</h2>
  {% if deadline %}
    <div class="alert alert-info mb-4">
      <strong>Deadline assigned by Reviewer:</strong> {{ deadline }}
    </div>
  {% endif %}
  <form method="post" enctype="multipart/form-data" class="p-3 rounded bg-light shadow-sm" style="max-width:500px;margin:auto;">
    <div class="mb-3">
      <label class="form-label">PIC Name</label>
      <input class="form-control" name="name" placeholder="Person In Charge" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Excel file</label>
      <input type="file" class="form-control" name="file" accept=".xlsx,.xls" required />
    </div>
    <button class="btn btn-primary w-100" type="submit">Upload</button>
  </form>
{% endblock %}
